# FDS: F3-CI | Parent: CUSTOM_INSTRUCTIONS_V3_5_ORD.md | Hawkins: internal-only | Status: ACTIVE
# Q-TEMPORAL-DISSOLUTION-01 Enforcement: Reject new INTERNAL_WORK_DEADLINE patterns
name: Temporal Dissolution Gate (Q-TEMPORAL-DISSOLUTION-01)

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  temporal-purity:
    runs-on: ubuntu-latest
    name: Enforce temporal purity (Q-TEMPORAL-DISSOLUTION-01)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit range
        id: commit_range
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "range=${{ github.event.before }}..${{ github.event.after }}" >> $GITHUB_OUTPUT
          fi

      - name: Check for INTERNAL_WORK_DEADLINE patterns
        id: check_deadlines
        run: |
          # Patterns to detect INTERNAL_WORK_DEADLINE violations:
          # Only check newly added lines (starting with +) to avoid false positives in docs/schemas
          # Target actual business logic, not documentation strings

          VIOLATIONS=""
          DIFF_OUTPUT=$(git diff ${{ steps.commit_range.outputs.range }})

          # Check for explicit INTERNAL_WORK_DEADLINE markers in added code only
          if echo "$DIFF_OUTPUT" | grep "^\+.*INTERNAL_WORK_DEADLINE\|INVALID_INTERNAL_DEADLINE"; then
            VIOLATIONS="${VIOLATIONS}Found explicit INTERNAL_WORK_DEADLINE markers\n"
          fi

          # Check for hardcoded deadline dates in conditionals (YYYY-MM-DD) in added code only
          # Match patterns like: if (date > "2026-01-15") or dateCheck("2026-01-15")
          if echo "$DIFF_OUTPUT" | grep "^\+.*\(if\|when\|check\).*[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}"; then
            VIOLATIONS="${VIOLATIONS}Found hardcoded deadline dates in conditionals\n"
          fi

          # Check for days-based urgency calculations in added code only
          # Match patterns like: < 5 days, > 10 days (but not "deadline days" in docs)
          if echo "$DIFF_OUTPUT" | grep "^\+.*\(< [0-9]\+ *days\?\|> [0-9]\+ *days\?\)"; then
            VIOLATIONS="${VIOLATIONS}Found deadline-based urgency calculations\n"
          fi

          # Check for deadline-based prioritization logic in added code only
          # Match patterns like: results["urgent"] or isUrgent = deadline < now
          if echo "$DIFF_OUTPUT" | grep "^\+.*\(results\[\"urgent\"\]\|results\[\"soon\"\]\|isUrgent.*deadline\|isPriority.*deadline\)"; then
            VIOLATIONS="${VIOLATIONS}Found deadline-based priority classifications\n"
          fi

          if [ -n "$VIOLATIONS" ]; then
            echo "violations=true" >> $GITHUB_OUTPUT
            echo -e "Temporal purity violations detected:\n$VIOLATIONS" >> $GITHUB_OUTPUT
          else
            echo "violations=false" >> $GITHUB_OUTPUT
          fi

      - name: Report gate status
        if: always()
        run: |
          if [ "${{ steps.check_deadlines.outputs.violations }}" == "true" ]; then
            echo "❌ Q-TEMPORAL-DISSOLUTION-01 GATE FAILED"
            echo ""
            echo "Violations detected:"
            echo -e "${{ steps.check_deadlines.outputs.violations }}"
            echo ""
            echo "The Q-TEMPORAL-DISSOLUTION-01 gate prohibits INTERNAL_WORK_DEADLINE semantics."
            echo "Work scheduling must use state-based resource allocation (RBE model)."
            echo ""
            echo "Allowed temporal patterns:"
            echo "  • OBSERVATIONAL — timestamps for reference only (no prioritization)"
            echo "  • TECHNICAL_SAFETY — timeouts, retries, polling intervals (system safety)"
            echo "  • REGULATORY_EXTERNAL — deadlines from external bodies (NIH, NSF, grants)"
            echo "  • HISTORICAL_RECORD — archival and audit logging"
            echo ""
            echo "Reference: PRIORITY_QUEUE.md + TEMPORAL_AUDIT_Q-TEMPORAL-DISSOLUTION-01.md"
            exit 1
          else
            echo "✓ Q-TEMPORAL-DISSOLUTION-01 GATE PASSED"
            echo "No INTERNAL_WORK_DEADLINE patterns detected in this change."
          fi
